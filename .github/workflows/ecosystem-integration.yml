name: Ecosystem Integration Test

on:
  pull_request:
    branches:
      - "**"
  workflow_dispatch:

permissions:
  contents: read
  packages: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  integration-test:
    # Pinned to a commit for supply-chain safety (an unpinned @main ref would execute
    # whatever lands upstream, including a compromised commit, with no review gate).
    # Renovate keeps this current via frequent, CI-gated automerge - see renovate.json.
    uses: diggsweden/wallet-ecosystem/.github/workflows/reusable-integration.yml@91e6dd6af256365de48e8d368a3a1218698329ec # main
    with:
      service-name: wallet-client-gateway
      service-repo: ${{ github.repository }}
      service-ref: ${{ github.event.pull_request.head.sha || github.ref }}

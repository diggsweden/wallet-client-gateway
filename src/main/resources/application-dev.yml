spring:
  config:
    import: classpath:application.yml
  docker:
    compose:
      enabled: ${SPRING_DOCKER_COMPOSE_ENABLED:false}
      file: ./docker-compose/docker-compose.yml
  data:
    redis:
      port: ${VALKEY_PORT:6380}

properties:
  feature-flags:
    file-path: ./docker-compose/feature-flags.json
  client-config:
    features:
      - example
      - unset-feature
  logging-filter:
    enabled: true
    max-payload-length: 1000
    exclude-path:
      exact-match: >
        /
      contains: >
        /actuator, /swagger, /v3/api-docs, .html, .js, .yaml
    sensitive-data-mask:
      mask-value: "***MASKED***"
      # Only these names are logged in clear, every other value is masked. Matched case-insensitively.
      # Container contents are checked individually against the allow-list.
      allowed-headers: >
        accept, accept-encoding, accept-language, content-type, content-length, host, user-agent, wallet-app-version, wallet-device-os, wallet-device-os-version, wallet-device-model
      allowed-body-json-fields: >
        accountid, id, status, title, type, detail, instance, reason, property, resulturl, name, version, releasedate, cachegeneration, startsat, endsat, active, url, kty, kid, alg, use, crv, x, y, serverjwspublickey, opaqueserverid, ttl

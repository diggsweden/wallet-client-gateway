openapi: 3.1.0
info:
  title: Wallet Provider API
  description: European Digital Identity Wallet Provider.
  version: 0.0.1
  termsOfService: https://www.digg.se/
  contact:
    name: Digg - Agency for Digital Government
    url: https://www.digg.se/
    email: info@digg.se
  license:
    name: EUPL-1.2
    url: https://joinup.ec.europa.eu/collection/eupl/eupl-text-eupl-12
  x-sla:
    availability: Test
    responseTime: 24
    support: Kontorstid
  x-limitations:
    - SAK.01
    - DOK.15
    - UFN.02
    - MOG.02
    - DOK.06
    - UFN.01
    - VER.05
servers:
  - url: '/'
tags:
  - name: Key Attestation
    description: Operations related to Key Attestation (KA)
  - name: Wallet Unit Attestation
    description: Operations related to Wallet Unit Attestation (WUA)
  - name: API Info
    description: Information about the API
paths:
  /v0/key-attestations:
    post:
      tags:
        - Key Attestation
      summary: Create Key Attestation
      description: Creates a Key Attestation (KA) required for binding keys in the credential issuance flow.
      operationId: postKeyAttestation
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/KeyAttestationRequest'
      responses:
        "200":
          description: Successfully created Key Attestation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KeyAttestationResponse'
        default:
          description: Unexpected error
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemResponse'
  /wallet-unit-attestation:
    post:
      deprecated: true
      tags:
        - Wallet Unit Attestation
      summary: Create Wallet Unit Attestation
      description: Creates a Wallet Unit Attestation (WUA) required for the wallet instance to interact with the ecosystem.
      operationId: postWalletUnitAttestation
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WalletUnitAttestationRequest'
      responses:
        "200":
          description: Successfully created Wallet Unit Attestation
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/WalletUnitAttestationResponse'
        "400":
          description: Bad Request
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemResponse'
        "500":
          description: Internal Server Error
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemResponse'
        default:
          description: Unexpected error
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemResponse'
  /api-info:
    get:
      tags:
        - API Info
      summary: Get API Information
      description: Returns information about the API, its version, and status.
      operationId: getApiInfo
      responses:
        "200":
          description: Successfully retrieved API information
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiInfo'
              example:
                version: "v0"
                status: "OK"
        "400":
          description: Bad Request
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemResponse'
        "500":
          description: Internal Server Error
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemResponse'
        default:
          description: Unexpected error
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemResponse'
components:
  schemas:
    KeyAttestationRequest:
      type: object
      required:
        - jwks
      properties:
        jwks:
          type: array
          items:
            $ref: '#/components/schemas/KeyAttestationItem'
          description: A list of JSON Web Keys representing the public keys of the client.
        nonce:
          type: string
          description: Optional nonce from the Credential Issuer.
      example:
        jwks:
          - jwk: '{"kty":"EC","crv":"P-256","x":"...","y":"..."}'
        nonce: "1234567890"

    KeyAttestationItem:
      type: object
      description: An item containing a client public key for key attestation.
      required:
        - jwk
      properties:
        jwk:
          type: string
          description: A JSON Web Key representing the public key of the client.
      example:
        jwk: '{"kty":"EC","crv":"P-256","x":"...","y":"..."}'

    KeyAttestationResponse:
      type: object
      required:
        - key_attestation
      properties:
        key_attestation:
          type: string
          description: The signed Key Attestation as a compact JWT string.

    WalletUnitAttestationRequest:
      type: object
      required:
        - jwk
      properties:
        jwk:
          type: string
          description: A JSON Web Key representing the public key of the Wallet Instance.
        nonce:
          type: string
          description: Optional nonce to prevent replay attacks.
      example:
        jwk: '{"kty":"EC","crv":"P-256","x":"...","y":"..."}'
        nonce: "1234567890"

    WalletUnitAttestationResponse:
      type: string
      description: The signed Wallet Unit Attestation as a JWT string

    ApiInfo:
      type: object
      required:
        - version
        - status
      properties:
        version:
          type: string
          description: API Version
        status:
          type: string
          description: API Status

    ProblemResponse:
      type: object
      description: Problem detail object based on RFC 9457, returned on request failure.
      properties:
        type:
          type: string
          description: |
            A URI that identifies the problem type. When this member is null, blank, or not present,
            its value is assumed to be "about:blank". It indicates that the problem has no additional
            semantics beyond that of the HTTP status code.
          example: /problem-details/request-validation-failure
        status:
          type: integer
          description: Reflects the HTTP response status code returned by the server.
          minimum: 100
          maximum: 599
          example: 400
        title:
          type: string
          description: A short, human-readable summary of the problem type.
          example: Bad Request
        detail:
          type: string
          description: A human-readable explanation specific to this occurrence of the problem.
          example: Request body field value(s) does not validate.
        instance:
          type: string
          description: |
            A URI reference that identifies the specific occurrence of the problem.
            Typically the request path or request URI.
          example: /wallet-unit-attestation
        transaction-id:
          type: string
          description: A unique request identifier that can be used for debugging or troubleshooting.
        invalid-parameters:
          type: array
          description: |
            A list of invalid request parameters or fields. Depending on the problem type,
            this property might be null, empty, or not present.
          items:
            $ref: "#/components/schemas/ProblemParameterResponse"
      required:
        - status
        - title

    ProblemParameterResponse:
      type: object
      description: Detailed information about an invalid request parameter.
      properties:
        reason:
          type: string
          description: A human-readable explanation specific to the parameter.
          example: must not be null
        value:
          type: string
          description: The supplied parameter value.
        property:
          type: string
          description: Name of the request field or parameter.
          example: jwk

spring:
  config:
    import: optional:classpath:application-main.yml

# Application Properties
properties:
  apisecret: my_secret_key
  oldapisecret: my_old_secret_key
  public-paths:
    - "/"
    - "/actuator/**"
    - "/api-info"
    - "/wallet-client-gateway-openapi-*.yaml"
    - "/v3/api-docs/**"
    - "/swagger-ui.html"
    - "/swagger-ui/**"
    - "/public/**"
  api-key-paths:
    - "/v0/accounts"
    - "/util/v0/client-configs"
    - "/util/v0/maintenance-windows"
  walletprovider:
    baseurl: http://localhost:${wiremock.provider.port:0}
  walletaccount:
    baseurl: http://localhost:${wiremock.account.port:0}
  wallet-r2ps:
    baseurl: http://localhost:${wiremock.r2ps.port:0}
  challenge-cache:
    ttl-seconds: 10
  feature-flags:
    file-path: src/test/resources/feature-flags.json
  client-config:
    cache-max-age: 5m
    features:
      - example
      - unset-feature

  maintenance:
    # Served during a maintenance window; everything else gets 503 with Retry-After
    allowed-paths:
      - "/actuator/**"
      - "/util/v0/client-configs"
      - "/util/v0/maintenance-windows"

  logging-filter:
    enabled: true
    max-payload-length: 1000
    exclude-path:
      exact-match: >
        /
      contains: >
        /actuator, /swagger, /api-docs, .html, .js, .yaml
    sensitive-data-mask:
      mask-value: "***MASKED***"
      # Only these names are logged in clear, every other value is masked. Matched case-insensitively.
      # Container contents are checked individually against the allow-list.
      allowed-headers: >
        accept, accept-encoding, accept-language, content-type, content-length, host, user-agent, wallet-app-version, wallet-device-os, wallet-device-os-version, wallet-device-model
      allowed-body-json-fields: >
        accountid, id, status, title, type, detail, instance, reason, property, resulturl, name, version, releasedate, cachegeneration, startsat, endsat, active, url, kty, kid, alg, use, crv, x, y, serverjwspublickey, opaqueserverid, ttl
  resilience:
    retry-policy:
      max-retries: 2
      delay-millis: 100
      multiplier: 1
